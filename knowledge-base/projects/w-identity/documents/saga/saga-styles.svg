<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="system-ui,sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs>
<rect width="760" height="500" fill="#f8fafc"/>
<text x="24" y="32" font-size="15" font-weight="700" fill="#0f172a">A. Choreography — các service tự nối nhau bằng event</text>
<rect x="35" y="66" width="150" height="48" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
<text x="110" y="95" text-anchor="middle" font-weight="700" fill="#0c4a6e">Order</text>
<rect x="305" y="66" width="150" height="48" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
<text x="380" y="95" text-anchor="middle" font-weight="700" fill="#0c4a6e">Inventory</text>
<rect x="575" y="66" width="150" height="48" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
<text x="650" y="95" text-anchor="middle" font-weight="700" fill="#0c4a6e">Payment</text>
<line x1="185" y1="90" x2="303" y2="90" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="244" y="80" text-anchor="middle" fill="#334155" font-size="11">OrderCreated</text>
<line x1="455" y1="90" x2="573" y2="90" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="514" y="80" text-anchor="middle" fill="#334155" font-size="11">StockReserved</text>
<path d="M650,114 V152 H110 V116" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="144" text-anchor="middle" fill="#334155" font-size="11">PaymentCompleted → đơn APPROVED</text>
<text x="24" y="186" fill="#475569" font-size="12">Lỗi thì phát event thất bại (PaymentFailed); service khác nghe và tự bù trừ. Logic luồng rải rác nhiều nơi.</text>
<line x1="24" y1="208" x2="736" y2="208" stroke="#cbd5e1"/>
<text x="24" y="240" font-size="15" font-weight="700" fill="#0f172a">B. Orchestration — một orchestrator ra lệnh và giữ state</text>
<rect x="240" y="260" width="280" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="380" y="285" text-anchor="middle" font-weight="700" fill="#78350f">CreateOrderSaga (orchestrator)</text>
<text x="380" y="305" text-anchor="middle" fill="#78350f" font-size="11">state machine, lưu state sau mỗi bước</text>
<path d="M300,320 V356 H110 V402" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M380,320 V402" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M460,320 V356 H650 V402" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
<text x="205" y="348" text-anchor="middle" fill="#334155" font-size="11">create / approve / reject</text>
<text x="388" y="380" fill="#334155" font-size="11">reserve / release</text>
<text x="555" y="348" text-anchor="middle" fill="#334155" font-size="11">charge (pivot)</text>
<rect x="35" y="404" width="150" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="110" y="433" text-anchor="middle" font-weight="700" fill="#14532d">Order</text>
<rect x="305" y="404" width="150" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="380" y="433" text-anchor="middle" font-weight="700" fill="#14532d">Inventory</text>
<rect x="575" y="404" width="150" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="650" y="433" text-anchor="middle" font-weight="700" fill="#14532d">Payment</text>
<text x="24" y="482" fill="#475569" font-size="12">Mỗi service trả reply; orchestrator quyết định bước kế tiếp hoặc chạy compensation theo thứ tự ngược.</text>
</svg>
